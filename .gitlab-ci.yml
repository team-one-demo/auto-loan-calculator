image: maven:3.8-openjdk-11

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Code-Quality.gitlab-ci.yml

stages:
  - build
  - test
  - sast
  - code_quality
  - package
  - deploy

cache:
  paths:
    - .m2/repository

build:
  stage: build
  script:
    - mvn compile

test:
  stage: test
  script:
    - mvn test

# SAST scanning jobs are automatically included from the template

# Code Quality job configuration
code_quality:
  stage: code_quality
  artifacts:
    paths: [gl-code-quality-report.json]

# Maven-specific SAST scanning
spotbugs-sast:
  stage: sast
  variables:
    MAVEN_REPO_PATH: .m2/repository

package:
  stage: package
  script:
    - mvn package -DskipTests
  artifacts:
    paths:
      - target/*.jar

deploy:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker buildx create --use
  script:
    - export TIMESTAMP=$(date +%s)
    - docker buildx build --platform linux/amd64,linux/arm64 --tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-${TIMESTAMP} --push ${CI_PROJECT_DIR}

